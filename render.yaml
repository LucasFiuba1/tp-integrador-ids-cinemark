# Blueprint de Render: dos Web Services gratuitos (API y sitio) desde la raíz del repositorio.
# Sin base de datos, discos ni jobs de Render: la base MySQL es externa (DB_* se cargan en el panel).
services:
  - type: web
    name: cine-paradiso-api
    runtime: python
    plan: free
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: gunicorn "src.backend.app:create_app()" --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --access-logfile -
    healthCheckPath: /api/salud
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: TZ
        value: America/Argentina/Buenos_Aires
      - key: SECRET_KEY
        generateValue: true
      - key: DB_SSL
        value: "true"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: TMDB_API_KEY
        sync: false

  - type: web
    name: cine-paradiso-web
    runtime: python
    plan: free
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: gunicorn "src.frontend.app:create_app()" --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --access-logfile -
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: TZ
        value: America/Argentina/Buenos_Aires
      - key: FRONTEND_SECRET_KEY
        generateValue: true
      # URL pública https del API (Render Free no tiene red privada), por ejemplo https://cine-paradiso-api.onrender.com
      - key: BACKEND_URL
        sync: false
      # El API gratuito se duerme: el primer pedido puede tardar en responder.
      - key: BACKEND_TIMEOUT
        value: "90"
